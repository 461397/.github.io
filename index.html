<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的作業網頁</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: '微軟正黑體', sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            padding: 50px;
        }
        #cat-container {
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 400px;
        }
        img {
            max-width: 100%;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>Web 程式設計作業</h1>
    <p>測試 jQuery 與 Ajax 抓取 JSON 資料</p>
    
    <div id="cat-container">
        <button id="get-cat-btn">給我一隻貓貓</button>
        <div id="result" style="margin-top: 20px;"></div>
    </div>

    <script>
       
        $(document).ready(function(){
            
            $("#get-cat-btn").click(function(){
                
                $.ajax({
                    url: "https://api.thecatapi.com/v1/images/search",
                    type: "GET",
                    dataType: "json",
                    success: function(data) {
                        
                        let catImageUrl = data[0].url;
                      
                        $("#result").html(`<img src="${catImageUrl}" alt="隨機貓咪">`);
                    },
                    error: function() {
                        $("#result").html("<p>發生錯誤，無法取得圖片！</p>");
                    }
                });
            });
        });
    </script>

</body>
</html>
